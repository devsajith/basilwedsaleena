<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="20" y1="10" x2="100" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FBF5B7"/>
      <stop offset="30%" stop-color="#D4AF37"/>
      <stop offset="70%" stop-color="#AA771C"/>
      <stop offset="100%" stop-color="#E6CA65"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#556B2F" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="120" height="120" rx="30" fill="#FAF9F6" />
  <rect x="4" y="4" width="112" height="112" rx="26" fill="none" stroke="url(#goldGrad)" stroke-width="4"/>

  <!-- Cross & Rings Motif -->
  <g filter="url(#shadow)">
    <!-- Interlocked Wedding Rings at Base -->
    <circle cx="46" cy="80" r="18" stroke="url(#goldGrad)" stroke-width="5" fill="none"/>
    <circle cx="74" cy="80" r="18" stroke="url(#goldGrad)" stroke-width="5" fill="none"/>

    <!-- Holy Christian Cross -->
    <rect x="54" y="18" width="12" height="66" rx="3" fill="url(#goldGrad)" />
    <rect x="32" y="32" width="56" height="12" rx="3" fill="url(#goldGrad)" />
    
    <!-- Cross Halo Ring -->
    <circle cx="60" cy="38" r="15" stroke="url(#goldGrad)" stroke-width="3" fill="none" opacity="0.85"/>
  </g>
</svg>